<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Workshop Bookings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1.25rem; margin-top: 1rem; background: #fafafa; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    select, input, button { font-size: 1rem; padding: 0.5rem; margin-top: 0.35rem; width: 100%; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 1rem; }
    button:hover { background: #1557b0; }
    .feedback { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
    .feedback.success { display: block; background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .feedback.error { display: block; background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
  </style>
</head>
<body>
  <h1>Campus Media Lab Workshops</h1>

  <label for="workshop-select">Choose a workshop:</label>
  <select id="workshop-select"></select>

  <div id="workshop-details" class="card">
    <p><strong>Room:</strong> <span id="workshop-room">-</span></p>
    <p><strong>Seats available:</strong> <span id="workshop-seats">-</span></p>
  </div>

  <form id="booking-form">
    <label for="student-name">Your name:</label>
    <input type="text" id="student-name" placeholder="Enter your full name" required />
    <button type="submit">Book One Seat</button>
  </form>

  <div id="feedback" class="feedback" role="status"></div>

  <script src="/app.js"></script>
</body>
</html>
